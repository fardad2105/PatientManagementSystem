server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  datasource:
    # Defaults below are local-dev values; set the env vars to override (deploy does).
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/thyrocare}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
    generator:
      write-bigdecimal-as-plain: true
    deserialization:
      fail-on-unknown-properties: false

app:
  # Local-dev defaults: override via env vars in any real deployment (see deploy/docker-compose.yml).
  jwt-secret: ${JWT_SECRET:661f632dc7b8b26b8cc665a7d289a4f35dba102c4403b4130c04696f59d49b32}
  admin-email: ${ADMIN_EMAIL:gillianarchuleta90119@outlook.com}
  admin-password: ${ADMIN_PASSWORD:ThyroAdmin#2026}
  seed-demo-data: ${SEED_DEMO_DATA:true}
  cors-origins: ${CORS_ORIGINS:http://localhost:3000}
  cookie-secure: ${COOKIE_SECURE:false}
  storage-url: ${INTEGRATION_PROXY_URL:}
  emergent-key: ${EMERGENT_LLM_KEY:}
